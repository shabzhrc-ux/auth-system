{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card">
  <h1>Create account</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
    </label>
    <label>Email
      <input name="email" type="email" value="{{ email or '' }}" autocomplete="email" required>
    </label>
    <label>Password
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <span id="strength" class="muted"></span>
    </label>
    <label>Confirm password
      <input name="confirm_password" type="password" autocomplete="new-password" required>
    </label>
    <button type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
